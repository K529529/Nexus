services:
  postgres:
    image: pgvector/pgvector:pg16-trixie
    environment:
      POSTGRES_DB: nexus
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
    ports:
      - "${NEXUS_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - nexus-postgres-data:/var/lib/postgresql/data

volumes:
  nexus-postgres-data:
