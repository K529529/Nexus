[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "nexus-agent"
version = "0.1.0"
description = "A transparent and extensible coding-agent runtime."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Nexus Contributors" }]
dependencies = [
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1",
    "langchain-openai>=1.0,<2",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-postgres>=3.1,<4",
    "langsmith>=0.11.1,<0.12",
    "mcp>=2,<3",
    "pathspec>=0.12,<2",
    "pgvector>=0.4,<1",
    "pydantic>=2.10,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "typer>=0.16,<1",
]

[project.scripts]
nexus = "nexus.interfaces.cli.app:main"

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nexus"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "langsmith_e2e: requires explicit external-export authorization and LangSmith configuration",
    "mcp_e2e: requires npx and the pinned real MCP reference server",
    "postgres: requires a reachable PostgreSQL service",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
