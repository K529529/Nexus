[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "nexus-coding-agent"
version = "0.3.0.dev9"
description = "A small, local, message-driven coding agent."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Archer" }]
dependencies = [
    "openai>=2,<3",
    "mcp>=2,<3",
    "prompt-toolkit>=3,<4",
    "rich>=14,<15",
    "pyyaml>=6,<7",
]

[project.urls]
Homepage = "https://github.com/K529529/Nexus"
Repository = "https://github.com/K529529/Nexus"
Issues = "https://github.com/K529529/Nexus/issues"

[project.scripts]
nexus = "nexus.app.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.11,<1",
    "types-pyyaml>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nexus"]

[tool.hatch.build.targets.sdist]
include = [
    "/src", "/tests", "/scripts/swebench_v0.py", "/docs/next",
    "/README.md", "/README.zh-CN.md", "/LICENSE", "/AGENTS.md", "/uv.lock",
]
exclude = [
    "/.env",
    "/.pytest-tmp-*",
    "/.uv-cache",
    "/coverage.json",
    "/tests/local",
]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
