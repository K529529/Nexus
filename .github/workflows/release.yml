name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"

      - name: Verify release tag matches package version
        shell: bash
        run: |
          package_version="$(python - <<'PY'
          import tomllib
          with open('pyproject.toml', 'rb') as fh:
              print(tomllib.load(fh)['project']['version'])
          PY
          )"
          release_version="${GITHUB_REF_NAME#v}"
          test "$package_version" = "$release_version"
          echo "Publishing version $package_version"

      - name: Install locked development dependencies
        run: uv sync --frozen --dev

      - name: Run offline release checks
        run: |
          uv lock --check
          uv run --frozen ruff check .
          uv run --frozen mypy src tests
          uv run --frozen pytest
          git diff --check

      - name: Build sdist and wheel
        run: uv build

      - name: Smoke-test installed wheel outside the checkout
        shell: bash
        run: |
          wheel="$(pwd)/$(ls dist/*.whl)"
          cd "$RUNNER_TEMP"
          uv venv --python 3.12 nexus-release-test
          uv pip install --python nexus-release-test "$wheel"
          nexus-release-test/bin/python -I -m nexus --version
          nexus-release-test/bin/python -I -m nexus --help
          uv pip check --python nexus-release-test

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish distribution to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/nexus-coding-agent
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
