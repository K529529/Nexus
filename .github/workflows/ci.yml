name: CI

on:
  pull_request:
  push:
    branches: [main, next]

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --frozen --dev
      - run: uv lock --check
      - run: uv run --frozen ruff check .
      - run: uv run --frozen mypy src tests
      - run: uv run --frozen pytest
      - run: uv build
      - run: git diff --check
      - name: Install wheel outside source and as a uv tool
        shell: bash
        run: |
          wheel="$(pwd)/$(ls dist/*.whl)"
          cd "$RUNNER_TEMP"
          uv venv --python 3.12 wheel-test
          uv pip install --python wheel-test "$wheel"
          uv run --no-project --python wheel-test python -m nexus --version
          uv run --no-project --python wheel-test python -m nexus --help
          export UV_TOOL_DIR="$RUNNER_TEMP/nexus-tools"
          export UV_TOOL_BIN_DIR="$RUNNER_TEMP/nexus-bin"
          uv tool install --python 3.12 "$wheel"
          "$UV_TOOL_BIN_DIR/nexus" --version
